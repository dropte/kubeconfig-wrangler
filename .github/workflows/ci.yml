name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check Electron sources
        working-directory: electron
        run: |
          node --check main.js
          node --check preload.js

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          go build -ldflags "-X github.com/kubeconfig-wrangler/cmd.Version=${{ github.sha }}" \
            -o bin/kubeconfig-wrangler-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kubeconfig-wrangler-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/kubeconfig-wrangler-*

  build-cli-macos:
    name: Build CLI (macOS)
    runs-on: macos-latest
    needs: [lint, test]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -ldflags "-X github.com/kubeconfig-wrangler/cmd.Version=${{ github.sha }}" \
            -o bin/kubeconfig-wrangler-darwin-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kubeconfig-wrangler-darwin-${{ matrix.goarch }}
          path: bin/kubeconfig-wrangler-darwin-${{ matrix.goarch }}

  build-electron:
    name: Build Electron App
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Build Go backend (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p bin/linux
          GOOS=linux GOARCH=amd64 \
            go build -ldflags "-X github.com/kubeconfig-wrangler/cmd.Version=${{ github.sha }}" \
            -o bin/linux/kubeconfig-wrangler .

      # The macOS app ships for both Apple Silicon and Intel, so the backend
      # must be a universal binary.
      - name: Build Go backend (macOS, universal)
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p bin/mac bin/darwin-amd64 bin/darwin-arm64
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch \
              go build -ldflags "-X github.com/kubeconfig-wrangler/cmd.Version=${{ github.sha }}" \
              -o bin/darwin-$arch/kubeconfig-wrangler .
          done
          lipo -create -output bin/mac/kubeconfig-wrangler \
            bin/darwin-amd64/kubeconfig-wrangler bin/darwin-arm64/kubeconfig-wrangler
          lipo -info bin/mac/kubeconfig-wrangler

      - name: Build Go backend (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p bin/win
          GOOS=windows GOARCH=amd64 \
            go build -ldflags "-X github.com/kubeconfig-wrangler/cmd.Version=${{ github.sha }}" \
            -o bin/win/kubeconfig-wrangler.exe .

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Audit Electron dependencies
        if: matrix.platform == 'linux'
        working-directory: electron
        run: npm audit --audit-level=high
        continue-on-error: true  # informational only; never blocks CI

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        working-directory: electron
        run: npm run build:linux -- --publish never

      # CI builds are signed when the certificate secret is available (not on
      # fork PRs) but never notarized; notarization happens in release.yml.
      - name: Build Electron app (macOS)
        if: matrix.platform == 'darwin'
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run build:mac -- --publish never

      - name: Build Electron app (Windows)
        if: matrix.platform == 'windows'
        working-directory: electron
        run: npm run build:win -- --publish never

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            electron/dist/kubeconfig-wrangler-*.dmg
            electron/dist/kubeconfig-wrangler-*.zip
            electron/dist/kubeconfig-wrangler-*.AppImage
            electron/dist/kubeconfig-wrangler-*.deb
            electron/dist/kubeconfig-wrangler-*.rpm
            electron/dist/kubeconfig-wrangler-*.exe
          if-no-files-found: error
