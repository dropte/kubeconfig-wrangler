# Categories for GitHub's auto-generated release notes (by pull request label).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - enhancement
        - feature
    - title: Bug fixes
      labels:
        - bug
        - fix
    - title: Security
      labels:
        - security
    - title: Other changes
      labels:
        - "*"
